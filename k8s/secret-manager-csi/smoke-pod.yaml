apiVersion: v1
kind: Pod
metadata:
  name: secret-csi-smoke
  namespace: platform
spec:
  serviceAccountName: secret-smoke
  containers:
    - name: smoke
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -e
          test -f /var/secrets/openai-api-key
          echo "mounted secret bytes: $(wc -c < /var/secrets/openai-api-key)"
          head -c 3 /var/secrets/openai-api-key | od -An -tx1
          sleep 3600
      volumeMounts:
        - name: secrets
          mountPath: /var/secrets
          readOnly: true
  volumes:
    - name: secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: platform-secrets
